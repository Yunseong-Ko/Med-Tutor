<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
  <title id="title">Endoscopic sclerotherapy context</title>
  <desc id="desc">Original educational schematic showing that endoscopic sclerotherapy is used for vascular or cystic lesion obliteration, not cystic duct bile leak decompression.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#fff7f7"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1f3a" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="920" height="520" rx="28" fill="url(#bg)"/>
  <rect x="36" y="34" width="848" height="452" rx="24" fill="#fff" stroke="#d7e4ef" filter="url(#softShadow)"/>

  <text x="64" y="78" font-family="Pretendard, Arial, sans-serif" font-size="24" font-weight="800" fill="#0b1f3a">Endoscopic sclerotherapy: not a bile leak decompression method</text>
  <text x="64" y="110" font-family="Pretendard, Arial, sans-serif" font-size="15" fill="#5f6f82">Sclerotherapy obliterates a target cavity or vessel; bile leak treatment requires low-pressure biliary drainage.</text>

  <rect x="96" y="162" width="290" height="230" rx="22" fill="#f8fbfd" stroke="#d9e5ed"/>
  <path d="M168 320 C187 254 222 214 278 196 C326 181 354 215 331 258 C315 288 274 283 256 252" fill="none" stroke="#c43d3d" stroke-width="18" stroke-linecap="round"/>
  <path d="M142 256 L245 245" stroke="#315f91" stroke-width="10" stroke-linecap="round"/>
  <path d="M245 245 L280 233" stroke="#315f91" stroke-width="4"/>
  <circle cx="284" cy="232" r="10" fill="#fff" stroke="#315f91" stroke-width="4"/>
  <text x="124" y="365" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" fill="#26323f">Sclerosant injection</text>
  <text x="124" y="388" font-family="Pretendard, Arial, sans-serif" font-size="14" fill="#5f6f82">e.g., varix/vascular lesion or selected cystic lesion</text>

  <rect x="532" y="162" width="290" height="230" rx="22" fill="#e7fbf4" stroke="#bfe7da"/>
  <path d="M596 260 C648 262 696 274 750 304" fill="none" stroke="#f0b34f" stroke-width="26" stroke-linecap="round"/>
  <path d="M596 260 C648 262 696 274 750 304" fill="none" stroke="#98651e" stroke-width="4" stroke-linecap="round"/>
  <path d="M661 275 C698 291 738 292 779 282" fill="none" stroke="#0d8d72" stroke-width="11" stroke-linecap="round"/>
  <circle cx="583" cy="258" r="13" fill="#fff" stroke="#c43d3d" stroke-width="4"/>
  <text x="560" y="365" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" fill="#0d6b56">Bile leak treatment</text>
  <text x="560" y="388" font-family="Pretendard, Arial, sans-serif" font-size="14" fill="#26323f">ERCP stent lowers duct pressure and diverts bile</text>

  <text x="426" y="270" font-family="Pretendard, Arial, sans-serif" font-size="34" font-weight="900" fill="#94a3b8">≠</text>
  <rect x="78" y="425" width="764" height="38" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="100" y="449" font-family="Pretendard, Arial, sans-serif" font-size="15" font-weight="800" fill="#a45a08">Exam distinction</text>
  <text x="238" y="449" font-family="Pretendard, Arial, sans-serif" font-size="15" fill="#26323f">Sclerotherapy closes/ablates; ERCP stenting drains/decompresses.</text>
</svg>
