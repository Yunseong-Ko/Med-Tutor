<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faculty Studio · 근거·미디어 — P:accine</title>
  <link rel="stylesheet" href="/tokens.css" />
  <link rel="stylesheet" href="./faculty-studio.css?v=20260716-1" />
  <link rel="stylesheet" href="./workspace.css?v=20260716-1" />
</head>
<body class="faculty-latest" data-workspace="evidence-media">
  <div class="fs2-shell">
    <header class="fs2-topbar">
      <a class="fs2-brand fsw-brand-link" href="./"><span class="fs2-logo">P</span><span><strong>P:accine</strong><span class="fs2-brand-sub">FACULTY STUDIO · ONTOLOGY</span></span></a>
      <nav class="fs2-topnav" id="fsw-topnav" aria-label="Faculty Studio 상단">
        <a href="./">새 문항 만들기</a><a href="./import.html">문항 가져오기</a><a href="./review.html">검토·승인 <span class="fsw-nav-count" data-review-count hidden></span></a><a href="./guideline-claims.html">가이드라인 검토</a>
        <a class="fs2-nav-active" href="./evidence-media.html" aria-current="page">근거·미디어</a><a href="./archive.html">내보내기</a>
      </nav>
      <div class="fsw-top-actions"><span class="fsw-policy-copy">업로드·검토는 여기서만</span><button class="fsw-menu-button" type="button" aria-controls="fsw-topnav" aria-expanded="false">메뉴</button></div>
    </header>

    <main class="fsw-main">
      <header class="fsw-page-head"><div><h1>근거·미디어</h1><p>근거 검토와 제시자료 관리를 분리합니다. 생성 화면에서는 승인·비식별 자료만 선택할 수 있습니다.</p></div></header>
      <div class="fsw-tabs" role="tablist" aria-label="근거와 미디어">
        <button type="button" class="is-active" role="tab" aria-selected="true" data-resource-tab="evidence">근거 검토</button>
        <button type="button" role="tab" aria-selected="false" data-resource-tab="media">미디어 관리</button>
      </div>

      <section data-resource-panel="evidence">
        <div class="fsw-evidence-toolbar">
          <div class="fsw-status-filters" id="fsw-evidence-filters">
            <button class="is-active" type="button" data-evidence-status="draft">draft <span data-evidence-count="draft">0</span></button>
            <button type="button" data-evidence-status="needs_review">needs_review <span data-evidence-count="needs_review">0</span></button>
            <button type="button" data-evidence-status="verified">verified <span data-evidence-count="verified">0</span></button>
            <button type="button" data-evidence-status="rejected">rejected <span data-evidence-count="rejected">0</span></button>
          </div>
          <button class="fsw-secondary-button" type="button" id="fsw-evidence-reload">새로고침</button>
        </div>
        <div class="fsw-resource-list" id="fsw-evidence-list" aria-live="polite"><div class="fsw-loading-state"><span class="fsw-spinner"></span>근거 목록을 불러오는 중입니다.</div></div>
      </section>

      <section data-resource-panel="media" hidden>
        <div class="fsw-media-layout">
          <form id="fsw-media-form" class="fsw-upload-panel">
            <h2>제시자료 업로드</h2>
            <label class="fsw-dropzone is-compact"><input id="fsw-media-file" name="media_file" type="file" accept="image/*,.dcm" required /><span class="fsw-file-icon">↑</span><strong id="fsw-media-file-label">이미지 또는 DICOM 파일 선택</strong><small>환자·영상·병리·검사 자료</small></label>
            <div class="fsw-two-fields">
              <label class="fsw-field"><span>자료 유형</span><select name="asset_type"><option value="clinical_photo">임상 사진</option><option value="radiology">영상</option><option value="pathology">병리</option><option value="lab">검사</option></select></label>
              <label class="fsw-field"><span>Modality</span><input name="modality" type="text" placeholder="CT, MRI, CXR, PBS…" /></label>
              <label class="fsw-field"><span>과목</span><input name="subject" type="text" /></label>
              <label class="fsw-field"><span>단원</span><input name="unit" type="text" /></label>
              <label class="fsw-field"><span>진단/주제</span><input name="diagnosis" type="text" /></label>
              <label class="fsw-field"><span>Caption</span><input name="caption" type="text" /></label>
            </div>
            <label class="fsw-field"><span>핵심 소견</span><textarea name="key_findings" rows="3" placeholder="쉼표 또는 줄바꿈으로 구분"></textarea></label>
            <label class="fsw-field"><span>교수 메모</span><textarea name="faculty_note" rows="2"></textarea></label>
            <label class="fsw-check"><input name="deidentified" type="checkbox" value="true" /><span>비식별화를 확인했습니다.</span></label>
            <label class="fsw-check"><input name="approved_for_question_use" type="checkbox" value="true" /><span>문항 사용을 승인합니다.</span></label>
            <button class="fsw-primary-button" id="fsw-media-submit" type="submit">미디어 업로드</button>
          </form>
          <div class="fsw-media-bank">
            <div class="fsw-media-toolbar"><label class="fsw-search"><span class="fsw-sr-only">미디어 검색</span><input id="fsw-media-search" type="search" placeholder="modality·진단·caption 검색" /></label><select id="fsw-media-filter" aria-label="Modality 필터"><option value="all">전체 자료</option></select></div>
            <div class="fsw-media-grid" id="fsw-media-grid" aria-live="polite"><div class="fsw-loading-state"><span class="fsw-spinner"></span>미디어를 불러오는 중입니다.</div></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div class="fsw-overlay is-centered" id="fsw-delete-overlay" hidden>
    <button class="fsw-overlay-dismiss" type="button" data-delete-cancel aria-label="삭제 취소"></button>
    <section class="fsw-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="fsw-delete-title"><small>DELETE MEDIA</small><h2 id="fsw-delete-title">이 제시자료를 삭제할까요?</h2><p>로컬 미디어 보관함에서 제거됩니다. 이 작업은 되돌릴 수 없습니다.</p><div><button class="fsw-secondary-button" type="button" data-delete-cancel>취소</button><button class="fsw-danger-button" type="button" id="fsw-delete-confirm">삭제</button></div></section>
  </div>
  <div class="fsw-toast" id="fsw-toast" hidden role="status"></div>
  <script src="./faculty-workspace.js?v=20260716-1" defer></script>
</body>
</html>
